<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clue 1</title>
  <link rel="stylesheet" href="../style.css?v=12" />
</head>
<body class="clue1">

  <main class="card">
    <h1>Clue #1</h1>
    <p class="sub"></p>
    <div class="photo-row">
        <img src="../images/walking.JPG" alt="Us">
        <img src="../images/bar.JPG" alt="Us">
    </div>

    <div class="riddle">
      <p>
        Neon lights and rolling chances<br />
        Strikes, spares, and second glances...<br />
        A first kiss and some music talk too<br />
        Name the place where that memory grew.
      </p>
    </div>

    <div class="answer">
      <input id="answerInput" type="text" placeholder="Type your answer…" autocomplete="off" />
      <button class="btn yes" id="submitBtn">Submit </button>
    </div>

    <p id="feedback" class="tiny"></p>

    <div class="btn-row" style="margin-top: 14px;">
      <button class="btn yes" id="nextBtn" type="button" style="display:none;">
        Next ➜
      </button>
    </div>

    <a href="../" class="tiny" style="display:inline-block; margin-top: 18px;">← Back to start</a>
  </main>

  <script>
    const correct = "bowlero";

    const input = document.getElementById("answerInput");
    const submit = document.getElementById("submitBtn");
    const feedback = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");


    function normalize(s) {
      return s.toLowerCase().trim().replace(/\s+/g, "");
    }

    function checkAnswer() {
  const guess = normalize(input.value);

  if (!guess) {
    feedback.textContent = "Nice try hottie, but you gotta make a guess";
    return;
  }

  if (guess === correct) {
    feedback.textContent =
      "BAAAANNNNGGG!! Correct!! How magical was that night! It was straight out of a movie";

    nextBtn.style.display = "inline-block";

    // HEARTS ON SUBMIT
    animateHearts(submit);

    // optional: prevent re-submitting
    submit.disabled = true;
    input.disabled = true;

  } else {
    feedback.textContent = "Not quite, Try again cutie.";
  }
}


    submit.addEventListener("click", checkAnswer);

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkAnswer();
    });
  </script>

  <script>
    function animateHearts(sourceBtn) {
  sourceBtn.classList.remove("popped");
  void sourceBtn.offsetWidth;
  sourceBtn.classList.add("popped");

  for (let i = 0; i < 14; i++) spawnHeartFrom(sourceBtn);
}

  function animateHeartsAndGo(sourceBtn, url) {
    // pop animation restart (uses your .popped CSS)
    sourceBtn.classList.remove("popped");
    void sourceBtn.offsetWidth;
    sourceBtn.classList.add("popped");

    // hearts burst (uses your .heart CSS)
    for (let i = 0; i < 14; i++) spawnHeartFrom(sourceBtn);

    setTimeout(() => {
      window.location.href = url;
    }, 650);
  }

  function spawnHeartFrom(el) {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = Math.random() > 0.5 ? "💖" : "💘";

    const r = el.getBoundingClientRect();
    const x = r.left + r.width / 2;
    const y = r.top + r.height / 2;

    heart.style.left = (x + (Math.random() - 0.5) * 140) + "px";
    heart.style.top  = (y + (Math.random() - 0.5) * 60) + "px";

    document.body.appendChild(heart);
    heart.addEventListener("animationend", () => heart.remove());
  }

  nextBtn.addEventListener("click", (e) => {
    e.preventDefault();
    animateHeartsAndGo(nextBtn, "../clue2/");
  });
</script>


</body>
</html>
