<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💘 Valentine Scavenger Hunt</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="card">
    <!-- Photos -->
    <div class="photo-row">
      <img src="images/garden.JPG" alt="Us" />
      <img src="images/wedding.jpeg" alt="Us again" />
      <img src="images/msu.JPG" alt="gang" />
    </div>

    <!-- Text -->
    <h1>Lover's Lane Scavenger Hunt 2026</h1>
    <p class="message">
      You’ve been handpicked out of <strong>7 billion people</strong><br />
      to embark on this scavenger hunt.
    </p>
    <p class="message">
      Are you ready?
    </p>

    <!-- Buttons -->
    <div class="btn-row">
      <button class="btn yes" onclick="window.location.href='valentine/'">
        Yes
      </button>

      <button id="noBtn" class="btn no">
        No
      </button>
    </div>
  </main>

  <!-- Turn the No button into Yes -->
  <script>
  const btn = document.getElementById("toggleBtn");

  const triggerDistance = 120; // how close before it turns to Yes
  let isYes = false;

  document.addEventListener("mousemove", (e) => {
    const rect = btn.getBoundingClientRect();

    const btnX = rect.left + rect.width / 2;
    const btnY = rect.top + rect.height / 2;

    const dx = e.clientX - btnX;
    const dy = e.clientY - btnY;

    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < triggerDistance && !isYes) {
      toYes();
    } else if (distance >= triggerDistance && isYes) {
      toNo();
    }
  });

  function toYes() {
    isYes = true;
    btn.textContent = "Yes 💘";
    btn.classList.remove("no");
    btn.classList.add("yes");
    btn.onclick = () => window.location.href = "valentine/";
  }

  function toNo() {
    isYes = false;
    btn.textContent = "No 🙃";
    btn.classList.remove("yes");
    btn.classList.add("no");
    btn.onclick = null;
  }
</script>



</body>
</html>
