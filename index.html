<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💘 Valentine Scavenger Hunt</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="card">
    <!-- Photos -->
    <div class="photo-row">
      <img src="images/pic1.jpg" alt="Us 💕" />
      <img src="images/pic2.jpg" alt="Us again 💕" />
    </div>

    <!-- Text -->
    <h1>You’ve been handpicked 💖</h1>
    <p class="message">
      You’ve been handpicked out of <strong>7 billion people</strong><br />
      to embark on this scavenger hunt.
    </p>
    <p class="message">
      Are you ready?
    </p>

    <!-- Buttons -->
    <div class="btn-row">
      <button class="btn yes" onclick="window.location.href='valentine/'">
        Yes 💘
      </button>

      <button id="noBtn" class="btn no">
        No 🙃
      </button>
    </div>
  </main>

  <!-- Optional: make "No" run away -->
  <script>
    const noBtn = document.getElementById("noBtn");

    noBtn.addEventListener("mouseenter", () => {
      const maxX = window.innerWidth - noBtn.offsetWidth;
      const maxY = window.innerHeight - noBtn.offsetHeight;

      noBtn.style.position = "absolute";
      noBtn.style.left = Math.random() * maxX + "px";
      noBtn.style.top = Math.random() * maxY + "px";
    });
  </script>

</body>
</html>
